name: NPM publish JS SDK Nuxt 🚀

# Publishes @bxshefby/b24jssdk-nuxt (Nuxt module) to npm via OIDC trusted
# publishing.
#
# This is a TOP-LEVEL workflow on purpose. npm's Trusted Publisher entry for the
# package is keyed to this exact workflow filename (`npm-publish-js-sdk-nuxt.yml`);
# the OIDC token exchange 404s if the publishing job runs from any other file. The
# core SDK publishes from its sibling workflow (`npm-publish-js-sdk.yml`).
#
# The published Nuxt module declares a dependency on @bxshefby/b24jssdk at the
# released version. In the fork this workflow is dispatched by
# `npm-publish-js-sdk.yml` after the core publish, on the same tag. If a release
# is ever raised by a non-GITHUB_TOKEN identity, both workflows fire on the same
# `release: published` event instead, and in the brief window before the core
# publish lands an `npm install` of the Nuxt module could miss the matching core
# version. The build itself does not need core
# on npm (it resolves via the workspace), so the package contents are correct; the
# gap only affects an external install during those seconds.
on:
  release:
    types: [ published ]
  workflow_dispatch:

# Least privilege: only the publish job mints an OIDC token (job-level below);
# the build job, which runs dependency install scripts, never gets id-token.
permissions:
  contents: read

# Never run two nuxt publishes at once; do NOT cancel an in-flight publish.
concurrency:
  group: npm-publish-js-sdk-nuxt
  cancel-in-progress: false

jobs:
  ci:
    # Форк bx-shef/b24-js-sdk: выпуск @bxshefby/* включается переменной репозитория NPM_RELEASE=true
    # (Settings → Secrets and variables → Actions → Variables); см. RELEASING.md.
    if: github.repository == 'bx-shef/b24-js-sdk' && vars.NPM_RELEASE == 'true'
    uses: ./.github/workflows/ci.yml
    # See npm-publish-js-sdk.yml for why these permissions are granted here.
    permissions:
      contents: read
      pages: write
      id-token: write

  # Форк, #51: сборка отделена от публикации. Здесь — install-скрипты зависимостей всего workspace,
  # поэтому у job нет id-token: OIDC-токен публикации отсюда получить нельзя. Наружу уходит только
  # готовый tarball (`pnpm pack`) и его sha256.
  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify version lockstep across workspaces
        shell: bash
        run: |
          ROOT=$(jq -r .version package.json)
          SDK=$(jq -r .version packages/jssdk/package.json)
          NUXT=$(jq -r .version packages/jssdk-nuxt/package.json)
          if [ "$ROOT" != "$SDK" ] || [ "$ROOT" != "$NUXT" ]; then
            echo "::error::Version mismatch: root=$ROOT jssdk=$SDK nuxt=$NUXT"
            exit 1
          fi
          echo "All packages at version $ROOT"

      - name: Verify package version matches release tag
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        shell: bash
        run: |
          EXPECTED="${TAG#v}"
          ACTUAL=$(jq -r .version packages/jssdk-nuxt/package.json)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Release tag $TAG (expected version $EXPECTED) does not match package.json version $ACTUAL"
            exit 1
          fi

      - name: Verify version is not already published
        shell: bash
        run: |
          PKG=$(jq -r .name packages/jssdk-nuxt/package.json)
          VER=$(jq -r .version packages/jssdk-nuxt/package.json)
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "::error::$PKG@$VER is already published on npm"
            exit 1
          fi
          echo "$PKG@$VER is not yet published — OK to proceed"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned to 22 — the LOWEST supported + CI-validated Node line (the ci
          # test job runs a 22 + 24 matrix). Building the published artifact on
          # the floor, not the newest LTS, keeps the output consumable by every
          # supported consumer, and replaces the floating `lts/*` with a
          # deterministic runtime (#174).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare
        run: pnpm run dev:prepare

      - name: Build
        run: pnpm --filter ./packages/jssdk-nuxt build

      - name: Pack
        id: pack
        working-directory: packages/jssdk-nuxt
        shell: bash
        run: |
          # `pnpm pack`, not `npm pack`: dependencies are declared as `catalog:` /
          # `workspace:*` (#332), and only pnpm resolves those protocols when
          # packing. The publish job ships this exact tarball with `npm publish`.
          VER=$(jq -r .version package.json)
          OUT="$RUNNER_TEMP/npm-tarball"
          mkdir -p "$OUT"
          pnpm pack --pack-destination "$OUT" >/dev/null
          TGZ="bxshefby-b24jssdk-nuxt-$VER.tgz"
          test -f "$OUT/$TGZ" || { echo "::error::$TGZ not found in $OUT"; ls -la "$OUT"; exit 1; }
          test "$(find "$OUT" -name '*.tgz' | wc -l)" -eq 1 || { echo "::error::expected exactly one tarball in $OUT"; ls -la "$OUT"; exit 1; }
          echo "tarball=$TGZ" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$OUT/$TGZ" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Verify packed manifest
        shell: bash
        env:
          TGZ: ${{ steps.pack.outputs.path }}/${{ steps.pack.outputs.tarball }}
          EXPECTED: ${{ steps.pack.outputs.tarball }}
        run: |
          # Same contract as the "Pack" check in ci.yml (#332): `catalog:` and
          # `workspace:` must be resolved before the manifest reaches npm.
          tar -xzOf "$TGZ" package/package.json > "$RUNNER_TEMP/packed.json"
          node -e "const p=require(process.env.RUNNER_TEMP+'/packed.json'); for (const field of ['dependencies','peerDependencies','optionalDependencies']) for (const [name, range] of Object.entries(p[field]||{})) { if (String(range).startsWith('catalog:') || String(range).startsWith('workspace:')) { console.error('::error::packed manifest ships an unresolved specifier: '+field+'.'+name+'@'+range); process.exit(1) } } console.log('packed manifest specifiers resolved OK')"
          NAME=$(jq -r .name "$RUNNER_TEMP/packed.json")
          VER=$(jq -r .version "$RUNNER_TEMP/packed.json")
          if [ "$NAME" != "$(jq -r .name packages/jssdk-nuxt/package.json)" ] || [ "$VER" != "$(jq -r .version packages/jssdk-nuxt/package.json)" ]; then
            echo "::error::packed manifest is $NAME@$VER, expected $(jq -r .name packages/jssdk-nuxt/package.json)@$(jq -r .version packages/jssdk-nuxt/package.json)"
            exit 1
          fi
          echo "$EXPECTED: $NAME@$VER"
          # The module must pin the core it was built against: `workspace:*` packs to the exact version.
          # A `workspace:^` would pack to a range and pass the check above unnoticed.
          CORE=$(jq -r '.dependencies["@bxshefby/b24jssdk"]' "$RUNNER_TEMP/packed.json")
          if [ "$CORE" != "$VER" ]; then
            echo "::error::@bxshefby/b24jssdk in the packed manifest is '$CORE', expected exactly $VER"
            exit 1
          fi

      - name: Verify version token was replaced
        shell: bash
        env:
          TGZ: ${{ steps.pack.outputs.path }}/${{ steps.pack.outputs.tarball }}
        run: |
          # Checked in the packed tarball — exactly what gets published (#119).
          PKG_VER=$(jq -r .version packages/jssdk-nuxt/package.json)
          tar -xzOf "$TGZ" package/dist/module.mjs > "$RUNNER_TEMP/module.mjs"
          if grep -q "__SDK_VERSION__" "$RUNNER_TEMP/module.mjs"; then
            echo "::error::__SDK_VERSION__ was not replaced in dist/module.mjs — check packages/jssdk-nuxt/build.config.ts (#119)"
            exit 1
          fi
          if ! grep -qF "\"$PKG_VER\"" "$RUNNER_TEMP/module.mjs"; then
            echo "::error::version \"$PKG_VER\" (from package.json) not found in dist/module.mjs — wrong or empty replacement"
            exit 1
          fi
          echo "module.mjs meta.version = $PKG_VER (token replaced) — OK"

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: ${{ steps.pack.outputs.path }}/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  # Форк, #51: публикация готового tarball. Здесь нет checkout кода проекта и pnpm install — ни один
  # скрипт зависимостей не выполняется там, где можно получить OIDC-токен публикации.
  publish:
    needs: build
    runs-on: ubuntu-latest
    # Форк: окружение npm-release (Settings → Environments) пускает только main и теги v*; одобрения
    # нет (решение владельца). То же имя задано в Trusted Publisher пакета на npmjs.com: без него npm
    # сверял бы только репозиторий и имя файла.
    environment: npm-release
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    steps:
      - name: Download tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/npm-tarball

      - name: Verify tarball checksum
        shell: bash
        env:
          TGZ: ${{ runner.temp }}/npm-tarball/${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          echo "$SHA256  $TGZ" | sha256sum -c -

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
        # This installs the npm CLI itself, not project dependencies.
        run: npm install -g --ignore-scripts npm@11.21.2

      - name: 'Publish 🚀'
        shell: bash
        env:
          TGZ: ${{ runner.temp }}/npm-tarball/${{ needs.build.outputs.tarball }}
        run: |
          VER=$(tar -xzOf "$TGZ" package/package.json | jq -r .version)
          # A pre-release (e.g. 1.3.0-rc.1) must NOT take the default `latest`
          # dist-tag, or every `npm install` of the package would jump onto the
          # RC. Route pre-releases (version contains a `-`) to `next`; stable
          # versions keep `latest`.
          TAG_ARGS=()
          if [[ "$VER" == *-* ]]; then
            TAG_ARGS=(--tag next)
            echo "Pre-release $VER → dist-tag 'next'"
          else
            echo "Stable $VER → dist-tag 'latest'"
          fi
          # The tarball was packed by `pnpm pack` in the build job (catalog: and
          # workspace: already resolved and checked there). `--ignore-scripts`:
          # nothing from the package runs next to the OIDC token.
          npm publish "$TGZ" --provenance --access public --ignore-scripts "${TAG_ARGS[@]}"

