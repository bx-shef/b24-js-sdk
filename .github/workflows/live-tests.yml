name: live-tests

# Живые тесты на тестовом портале — только кнопкой Run workflow (вкладка Actions).
# Секреты репозитория: B24_HOOK — входящий вебхук ТЕСТОВОГО портала (права crm, tasks,
# user, im, main; тесты создают и удаляют записи), DEEPSEEK_API_KEY — для проверки чата.
# Значения секретов GitHub прячет в журнале; в шаги они идут только через env.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Что гонять: sdk — интеграционные тесты SDK, skills — навыки, chat — чат сайта (тратит DeepSeek), all — всё'
        type: choice
        options: [ sdk, skills, chat, all ]
        default: sdk

permissions:
  contents: read

concurrency:
  group: live-tests
  cancel-in-progress: false

jobs:
  portal:
    name: SDK и навыки на портале
    if: github.repository == 'bx-shef/b24-js-sdk' && inputs.suite != 'chat'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Секрет B24_HOOK задан
        env:
          B24_HOOK: ${{ secrets.B24_HOOK }}
        run: |
          if [ -z "${B24_HOOK}" ]; then
            echo "::error::Нет секрета B24_HOOK: Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare
        run: pnpm run dev:prepare

      - name: Интеграционные тесты SDK
        if: inputs.suite == 'sdk' || inputs.suite == 'all'
        env:
          B24_HOOK: ${{ secrets.B24_HOOK }}
        run: pnpm run package-jssdk:test:run

      - name: Живые тесты навыков
        if: inputs.suite == 'skills' || inputs.suite == 'all'
        env:
          B24_HOOK: ${{ secrets.B24_HOOK }}
        run: |
          pnpm run skills:install
          pnpm run skills:verify

  chat:
    name: Чат сайта с DeepSeek
    if: github.repository == 'bx-shef/b24-js-sdk' && (inputs.suite == 'chat' || inputs.suite == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Секрет DEEPSEEK_API_KEY задан
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::error::Нет секрета DEEPSEEK_API_KEY."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Сборка без ключа — как в образе (deploy/Dockerfile): ключ только при запуске.
      - name: Собрать сайт
        env:
          NUXT_MCP_ENABLED: 'true'
          NUXT_PUBLIC_BX_ASSISTANT_ENABLED: 'true'
          NUXT_TELEMETRY_DISABLED: '1'
        run: |
          pnpm run package-jssdk:prepare
          pnpm run package-jssdk-nuxt:prepare
          pnpm run docs:build

      - name: Вопрос чату по документации
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NUXT_PUBLIC_BX_ASSISTANT_ENABLED: 'true'
        shell: bash
        run: |
          (cd docs/.output && PORT=3000 HOST=127.0.0.1 node server/index.mjs > ../../server.log 2>&1 &)
          for _ in $(seq 1 60); do curl -fs localhost:3000/ >/dev/null && break; sleep 1; done
          body='{"messages":[{"id":"1","role":"user","parts":[{"type":"text","text":"Как вызвать метод REST API через вебхук? Ответь кратко со ссылкой на страницу документации."}]}]}'
          code=$(curl -sS --max-time 180 -o answer.txt -w '%{http_code}' -X POST -H 'content-type: application/json' -d "$body" localhost:3000/api/ai || true)
          echo "HTTP $code, ответ: $(wc -c < answer.txt) байт"
          # инструменты MCP вызваны и вернули страницы, а не ошибку
          grep -c '"type":"tool-' answer.txt || true
          if [ "$code" != 200 ] || ! grep -q '"type":"text-delta"' answer.txt; then
            echo "::error::Чат не ответил"; tail -c 2000 answer.txt; tail -50 server.log; exit 1
          fi
          if grep -q 'Nitro request context is not available' answer.txt; then
            echo "::error::Инструмент MCP упал внутри чата"; exit 1
          fi
          echo "--- начало ответа"; grep -o '"delta":"[^"]*"' answer.txt | head -60 | sed 's/"delta":"//;s/"$//' | tr -d '\n'; echo
