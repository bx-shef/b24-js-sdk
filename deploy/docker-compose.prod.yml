# Продакшн: сайт документации SDK за обратным прокси с TLS (deploy/README.md). Требует на хосте:
#   - docker-сеть proxy-net и nginx-proxy + acme-companion в ней — тот же прокси, что у соседей
#     (bx-shef/toolsai, site/landing/deploy/proxy.compose.yml);
#   - .env рядом с этим файлом (шаблон — deploy/.env.example);
#   - общий Watchtower с входом в ghcr — подхватит новый :latest по метке ниже.
# Наружу сайт выставляет прокси по VIRTUAL_HOST — порта на хосте нет.

name: b24-js-sdk-docs

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

services:
  docs:
    logging: *default-logging
    image: ghcr.io/bx-shef/b24-js-sdk-docs:latest
    container_name: b24-js-sdk-docs
    expose:
      - "3000"
    environment:
      # ⚠ DNS A-запись DOMAIN должна указывать на сервер до подъёма, иначе сертификат не выпустится.
      VIRTUAL_HOST: ${DOMAIN:?set DOMAIN}
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      # Чат помощника: без ключа он скрыт, а /api/ai отвечает 503.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      NUXT_PUBLIC_BX_ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      # Клиент — первый адрес X-Forwarded-For: его ставит nginx-proxy (лимит частоты чата по клиенту).
      NUXT_TRUST_PROXY: "true"
      # Номер Яндекс Метрики вшит в образ при сборке (секрет репозитория YANDEX_METRIKA_ID). Пустая
      # переменная здесь отключила бы его, поэтому задавать NUXT_PUBLIC_YANDEX_METRIKA_ID — только
      # чтобы заменить номер на этом сервере.
      ASSISTANT_RATE_PER_MINUTE: ${ASSISTANT_RATE_PER_MINUTE:-20}
      ASSISTANT_DAILY_LIMIT: ${ASSISTANT_DAILY_LIMIT:-2000}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
    networks:
      - proxy-net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  proxy-net:
    external: true
